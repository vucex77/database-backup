name: Railway DB Backup Otomasyonu

on:
  schedule:
    # Türkiye saati ile her gece 03:00'te çalışır (UTC 00:00)
    - cron: '0 0 * * *'
  # Manuel tetiklemek için buton:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      # Klasör bağımlılığı olmadan resmi PostgreSQL reposunu doğrudan ekliyoruz
      - name: PostgreSQL 18 Client Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg2
          # GPG anahtarını indiriyoruz
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          # Repoyu doğrudan sources.list.d içine yazıyoruz
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Veritabanı Yedeğini Al
        run: |
          mkdir -p database-backups
          BACKUP_FILE="database-backups/backup_$(date +'%Y-%m-%d_%H-%M-%S').sql"
          pg_dump "${{ secrets.RAILWAY_DB_URL }}" > "$BACKUP_FILE"

      - name: Yedeği GitHub'a Commit ve Push Et
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik Veritabanı Yedeği 💾"
          branch: main
          file_pattern: database-backups/*.sql
