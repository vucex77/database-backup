name: Railway DB Backup Otomasyonu

on:
  schedule:
    # Türkiye saati ile her gece 03:00'te çalışır (UTC 00:00)
    - cron: '0 0 * * *'
  # Manuel tetiklemek için buton:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      # PostgreSQL 18 deposunu ekliyoruz ki güncel sürüm kurulabilsin
      - name: PostgreSQL 18 Client Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg2
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.distrib.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Veritabanı Yedeğini Al
        run: |
          mkdir -p database-backups
          BACKUP_FILE="database-backups/backup_$(date +'%Y-%m-%d_%H-%M-%S').sql"
          pg_dump "${{ secrets.RAILWAY_DB_URL }}" > "$BACKUP_FILE"

      - name: Yedeği GitHub'a Commit ve Push Et
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik Veritabanı Yedeği 💾"
          branch: main
          file_pattern: database-backups/*.sql
