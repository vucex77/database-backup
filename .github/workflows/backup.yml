name: Railway DB Backup Otomasyonu

on:
  schedule:
    # Türkiye saati ile her gece 03:00'te çalışır (UTC 00:00)
    - cron: '0 0 * * *'
  # Manuel tetiklemek için buton:
  workflow_dispatch:

# GitHub'ın istediği gibi tüm sistemi şimdiden Node.js 24 kullanmaya zorluyoruz (Uyarılardan kurtulmak için)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Klasörü Hazırla
        run: mkdir -p database-backups

      # PostgreSQL'in resmi sürüm uyuşmazlığı yaşamamak için direkt Postgres 18 Docker konteyneri kullanıyoruz
      - name: Veritabanı Yedeğini Al (Docker)
        run: |
          BACKUP_FILE="database-backups/backup_$(date +'%Y-%m-%d_%H-%M-%S').sql"
          docker run --rm postgres:18 pg_dump "${{ secrets.RAILWAY_DB_URL }}" > "$BACKUP_FILE"

      - name: Yedeği GitHub'a Commit ve Push Et
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik Veritabanı Yedeği 💾"
          branch: main
          file_pattern: database-backups/*.sql
