name: Railway Database Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt update
          sudo apt install postgresql-client -y

      - name: Create Backup
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          pg_dump \
          -h ${{ secrets.DB_HOST }} \
          -p ${{ secrets.DB_PORT }} \
          -U ${{ secrets.DB_USER }} \
          -d ${{ secrets.DB_NAME }} \
          -F c \
          -f backup.dump

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: railway-backup
          path: backup.dump
